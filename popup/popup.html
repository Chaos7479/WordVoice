<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordVoice</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="header">
      <h1 class="logo">WordVoice</h1>
      <button id="openSidePanel" class="btn-icon" title="打开单词本">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
    </header>

    <!-- 搜索栏 -->
    <div class="search-bar">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索单词..." />
    </div>

    <!-- 统计数据 -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-icon">⚡</span>
        <span class="stat-value" id="todayCount">0</span>
        <span class="stat-label">今日</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-icon">📊</span>
        <span class="stat-value" id="weekCount">0</span>
        <span class="stat-label">本周</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-icon">🏆</span>
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">总计</span>
      </div>
    </div>

    <!-- 最近单词列表 -->
    <div class="word-list-header">
      <span>最近单词</span>
    </div>
    <div class="word-list" id="wordList">
      <div class="word-list-empty">暂无单词记录</div>
    </div>

    <!-- 底部提示 -->
    <div class="footer">
      <span class="shortcut-hint"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 发音选中文本</span>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
