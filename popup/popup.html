<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WordVoice</title>
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" data-icon="wave"></span><span class="brand-name">WordVoice</span>
        </div>
        <button id="openSettings" class="btn-icon" title="设置" data-icon="settings"></button>
      </header>
      <div class="popup-intro">
        <span class="eyebrow">A LITTLE EVERY DAY</span>
        <h1>每个新词，都有回响。</h1>
        <p>选中文字，按 <kbd>S</kbd>。听懂，也记住。</p>
      </div>
      <div class="search-bar">
        <span class="search-icon" data-icon="search"></span
        ><input
          type="search"
          id="searchInput"
          placeholder="搜索原文或翻译"
          aria-label="搜索单词"
        /><button
          id="clearSearch"
          class="clear-search"
          aria-label="清空搜索"
          data-icon="close"
          hidden
        ></button>
      </div>
      <div class="stats" aria-label="学习概览">
        <div class="stat-item">
          <span class="stat-value" id="todayCount">0</span><span class="stat-label">今日</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="weekCount">0</span><span class="stat-label">本周</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="totalCount">0</span><span class="stat-label">收藏</span>
        </div>
      </div>
      <div class="word-list-header">
        <span id="listHeading">最近遇见</span
        ><button id="openSidePanel">打开单词本 <span data-icon="arrow"></span></button>
      </div>
      <div class="word-list" id="wordList" aria-label="最近记录">
        <div class="word-list-empty">正在整理单词…</div>
      </div>
      <footer class="footer">
        <span class="shortcut-hint">留住好奇，继续阅读。</span>
        <div class="footer-actions">
          <button id="stopSpeech" title="停止朗读"><span data-icon="stop"></span>停止朗读</button>
        </div>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
